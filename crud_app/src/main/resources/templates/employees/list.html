<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zamestnanci</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: #222;
      background: #f5f5f5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 16px;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #eee;
    }

    .empty {
      text-align: center;
      color: #777;
    }

    .btn {
      display: inline-block;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      background: #555;
    }

    .btn-primary {
      background: #1a6fd1;
    }

    .btn-view {
      background: #2a9d8f;
    }

    .btn-edit {
      background: #e9a100;
    }

    .btn-delete {
      background: #d33;
    }

    form {
      display: inline;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>Zoznam zamestnancov</h2>

    <a th:href="@{/employee/create}" class="btn btn-primary">Pridať zamestnanca</a>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Meno</th>
          <th>Priezvisko</th>
          <th>Email</th>
          <th>Pozícia</th>
          <th>Akcie</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${employees}">
          <td th:text="${e.id}"></td>
          <td th:text="${e.firstName}"></td>
          <td th:text="${e.last_name}"></td>
          <td th:text="${e.email}"></td>
          <td th:text="${e.jobTitle}"></td>
          <td>
            <a th:href="@{/employee/{id}(id=${e.id})}" class="btn btn-view">Zobraziť</a>
            <a th:href="@{/employee/{id}/edit(id=${e.id})}" class="btn btn-edit">Upraviť</a>
            <form th:action="@{/employee/{id}/delete(id=${e.id})}" method="post"
              onsubmit="return confirm('Naozaj chcete vymazať tohto zamestnanca?');">
              <button type="submit" class="btn btn-delete">Vymazať</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
          <td colspan="6" class="empty">Zatiaľ tu nie sú žiadni zamestnanci.</td>
        </tr>
      </tbody>
    </table>

  </div>
</body>

</html>
