<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <title>Student Directory</title>
  <style>
    body {
      padding-top: 20px;
    }

    .header {
      margin-bottom: 20px;
    }

    .add-button {
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
    }

    .btn-group .btn {
      border-radius: 0.25rem;
      margin-right: 5px;
    }

    .btn-group .btn:last-child {
      margin-right: 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>UBIAN - Info o študentoch</h2>
    </div>

    <a th:href="@{/students/create}" class="btn btn-primary btn-sm mb-3">Pridať študenta</a>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Meno</th>
          <th>Priezvisko</th>
          <th>Dátum narodenia</th>
          <th>Akcia</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="student : ${students}">
          <td th:text="${student.firstName}"></td>
          <td th:text="${student.lastName}"></td>
          <td th:text="${#temporals.format(student.birthDate, 'dd. MM. yyyy')}"></td>
          <td>
            <div class="btn-group" role="group">
              <form th:action="@{'/students/' + ${student.id}}" method="get" class="d-inline">
                <button type="submit" class="btn btn-info btn-sm" title="View">
                  <i class="fas fa-eye"></i>
                </button>
              </form>
              <form th:action="@{'/students/' + ${student.id} + '/edit'}" method="get" class="d-inline">
                <button type="submit" class="btn btn-warning btn-sm" title="Update">
                  <i class="fas fa-edit"></i>
                </button>
              </form>
              <form th:action="@{'/students/' + ${student.id} + '/delete'}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm" title="Delete"
                  onclick="return confirm('Chcete naozaj vymazať tohto študenta?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

</body>

</html>
