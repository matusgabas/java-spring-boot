<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>register</title>
</head>

<body>
  <form th:action="@{/spracuj-formular}" th:object="${student}" method="POST">
    Meno: <input type="text" th:field="*{firstName}" />
    <br><br>
    Priezvisko: <input type="text" th:field="*{lastName}" />
    <br><br>
    Email: <input type="email" th:field="*{email}" />
    <br><br>
    Krajina:
    <select th:field="*{country}">
      <!--        <option th:value="Slovensko">Slovensko</option>-->
      <!--        <option th:value="Cesko">Cesko</option>-->
      <option th:each="tempCountry : ${countries}" th:value="${tempCountry}" th:text="${tempCountry}" />
    </select>
    <br><br>
    <input type="submit" value="Odoslať" />
  </form>
</body>

</html>
